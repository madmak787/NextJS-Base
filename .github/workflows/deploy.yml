name: Build & Deploy Dealighted.co Frontend

on:
  push:
    branches: [Development, Staging, UAT, Production]
  pull_request:
    branches: [Production]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Export Next public env to job
        run: |
          {
            echo "NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}"
          } >> "$GITHUB_ENV"

          case "${GITHUB_REF_NAME}" in
            development|Development)
              echo "NEXT_PUBLIC_APP_URL=https://dev.dealighted.co" >> "$GITHUB_ENV"
              echo "NEXT_PUBLIC_API_URL=https://dev-api.dealighted.co/api" >> "$GITHUB_ENV"
              ;;
            stage|staging|Stage|Staging)
              echo "NEXT_PUBLIC_APP_URL=https://staging.dealighted.co" >> "$GITHUB_ENV"
              echo "NEXT_PUBLIC_API_URL=https://staging-api.dealighted.co/api" >> "$GITHUB_ENV"
              ;;
            uat|UAT)
              echo "NEXT_PUBLIC_APP_URL=https://uat.dealighted.co" >> "$GITHUB_ENV"
              echo "NEXT_PUBLIC_API_URL=https://uat-api.dealighted.co/api" >> "$GITHUB_ENV"
              ;;
            production|Production)
              echo "NEXT_PUBLIC_APP_URL=https://dealighted.co" >> "$GITHUB_ENV"
              echo "NEXT_PUBLIC_API_URL=https://api.dealighted.co/api" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install deps (CI)
        run: npm ci

      - name: Build (Next static export)
        run: npm run build

      - name: Set target path
        id: vars
        run: |
          case "${GITHUB_REF_NAME}" in
            development|Development) echo "DIR=/domains/arc360.me/public_html/instances/development/" >> $GITHUB_OUTPUT ;;
            stage|staging|Stage|Staging) echo "DIR=/domains/arc360.me/public_html/instances/staging/" >> $GITHUB_OUTPUT ;;
            uat|UAT) echo "DIR=/domains/arc360.me/public_html/instances/uat/" >> $GITHUB_OUTPUT ;;
            production|Production) echo "DIR=/domains/arc360.me/public_html/" >> $GITHUB_OUTPUT ;;
          esac

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ steps.vars.outputs.DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
